name: Weekly content run

on:
  schedule:
    - cron: '17 11 * * *'   # daily, 06:17 ET (EST). Change in one place if needed.
  workflow_dispatch: {}      # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pipeline (FXEmpire API -> scoring -> Gemini drafts -> checks -> schedule)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node src/run.js
      - name: Keep a copy of this run
        run: |
          mkdir -p runs
          cp public/data.json "runs/$(date -u +%Y-%m-%dT%H%M)Z.json"
      - uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: public/data.json
      - name: Commit output (Vercel redeploys the board from this commit)
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add public/data.json runs/
          git commit -m "Content run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No changes"
          git push
